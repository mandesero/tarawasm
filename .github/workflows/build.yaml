name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo make install
          echo "PATH=/usr/local/go/bin:/opt/wasi-sdk/bin:/usr/bin:${PATH}" >> $GITHUB_ENV
          echo "GOROOT=/usr/local/go" >> $GITHUB_ENV

      - name: Debug Toolchain in PATH
        run: |
          echo "$PATH"
          ls -l /opt/wasi-sdk/bin/clang
          which go
          go version
          which node
          node --version
          which npm
          npm --version
          npm root -g
          which jco || true
          jco --version || true
          npm list -g --depth=0 @bytecodealliance/jco @bytecodealliance/componentize-js @bytecodealliance/preview2-shim || true
          which clang
          clang --version

      - name: Verify system toolchain
        run: make system-check

      - name: Verify SDK & Python deps
        run: make sdk-check

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Build CLI binary
        run: |
          make build
          echo "${{ github.workspace }}/target" >> $GITHUB_PATH

      - name: Run non-docker pytest tests (python and standalone modes)
        env:
          WASM_RUNTIME: wasmtime
        run: pytest -k "not cli:docker" -vv

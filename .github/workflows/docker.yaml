name: Docker build, test and publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "tags=mandeser0/tarawasm:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            echo "tags=mandeser0/tarawasm:$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tags=mandeser0/tarawasm:test" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          load: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Run pytest in docker mode
        env:
          TARAWASM_DOCKER_IMAGE: ${{ steps.vars.outputs.tags }}
          WASM_RUNTIME: wasmtime
        run: |
          pip install --no-cache-dir pytest
          pytest -k "cli:docker"

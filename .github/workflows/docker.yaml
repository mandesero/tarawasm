name: Docker build, test and publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "tags=mandeser0/tarawasm:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            echo "tags=mandeser0/tarawasm:$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tags=mandeser0/tarawasm:test" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          load: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: Run pytest in docker mode
        env:
          TARAWASM_DOCKER_IMAGE: ${{ steps.vars.outputs.tags }}
          TARAWASM_DOCKER_PLATFORM: linux/amd64
          TARAWASM_RUNTIME_MODE: docker
          WASM_RUNTIME: wasmtime
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install --no-cache-dir pytest
          python3 -m pytest -k "cli:docker"

      - name: Run upstream tool-repo integration tests
        env:
          TARAWASM_DOCKER_IMAGE: ${{ steps.vars.outputs.tags }}
          TARAWASM_DOCKER_PLATFORM: linux/amd64
          TARAWASM_UPSTREAM_MODE: docker
          TARAWASM_UPSTREAM_IT: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m pytest tests/test_upstream_tool_repos.py -vv

  language-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, go, js, rust, c]
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - name: Resolve language image reference
        id: image
        run: |
          python3 - <<'PY'
          import json, os
          catalog = json.load(open("tarawasm/toolchains/catalog.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("tag=mandeser0/tarawasm:" + catalog["image_release"] + "-${{ matrix.language }}\n")
          PY
      - name: Log in for release publication
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build language toolchain from current sources
        uses: docker/build-push-action@v4
        with:
          context: .
          target: ${{ matrix.language }}
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            tarawasm:ci-${{ matrix.language }}
            ${{ steps.image.outputs.tag }}
      - name: Check toolchain and host-side routing
        env:
          TARAWASM_LANGUAGE_IMAGE_PATTERN: tarawasm:ci-{language}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m pip install -r requirements.txt -r requirements-dev.txt
          docker run --rm --platform linux/amd64 tarawasm:ci-${{ matrix.language }} doctor --lang ${{ matrix.language }} --json
          python3 -m pytest 'tests/test_toolchain_images.py::test_host_routes_selected_docker_toolchain[${{ matrix.language }}]' -vv -ra
          docker image inspect tarawasm:ci-${{ matrix.language }} --format '{{.Id}} {{.Size}}'
      - name: Publish verified language image on release branches
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: docker push '${{ steps.image.outputs.tag }}'

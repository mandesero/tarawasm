name: Docker build, test and publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "tags=mandeser0/tarawasm:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            echo "tags=mandeser0/tarawasm:$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tags=mandeser0/tarawasm:test" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          load: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Run WASM tests for all languages
        run: |
          declare -A expected=(
            [python]="Hello from Python WASM!"
            [go]="Hello from Go WASM!"
            [js]="Hello from JS WASM!"
            [rust]="Hello from Rust WASM!"
            [c]="Hello from C WASM!"
          )
          for lang in "${!expected[@]}"; do
            echo "Testing $lang..."
            TMP=$(mktemp -d)
            cp examples/$lang/docs:adder@0.1.0.wasm $TMP/

            docker run --rm -v $TMP:/work -w /work mandeser0/tarawasm \
              init --lang "$lang" --wasm-file docs:adder@0.1.0.wasm adder
            docker run --rm -v $TMP:/work -w /work mandeser0/tarawasm bind
            docker run --rm -v $TMP:/work -w /work mandeser0/tarawasm build

            sudo chown -R $(id -u):$(id -g) $TMP
            chmod -R u+rwX $TMP

            if [ "$lang" == "c" ]; then
              wasm_file="$TMP/adder.component.wasm"
            else
              wasm_file="$TMP/adder.wasm"
            fi

            output=$(wasmtime "$wasm_file")
            echo "Output: $output"

            if [ "$output" != "${expected[$lang]}" ]; then
              echo "Expected: ${expected[$lang]}"
              echo "Actual: $output"
              exit 1
            fi
          done

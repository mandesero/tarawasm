name: Python package

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from email.parser import Parser
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              metadata = Parser().parsestr(wheel.read(next(n for n in wheel.namelist() if n.endswith('.dist-info/METADATA'))).decode())
          assert os.environ['RELEASE_TAG'] == 'v' + metadata['Version'], 'Release tag must match package version'
          PY
      - name: Install and smoke test outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/package-test"
          "$RUNNER_TEMP/package-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-test/bin/tarawasm" --help
          "$RUNNER_TEMP/package-test/bin/tarawasm" toolchain --help
          "$RUNNER_TEMP/package-test/bin/python" - <<'PY'
          from importlib.resources import files
          import json
          json.loads((files('tarawasm.toolchains') / 'catalog.json').read_text())
          json.loads((files('tarawasm.lang_deps') / 'csharp.packages.lock.json').read_text())
          assert (files('tarawasm.lang_deps') / 'wasi_snapshot_preview1.wasm').read_bytes().startswith(b'\0asm')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tarawasm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

[tool.black]
line-length = 88
target-version = ["py310"]
force-exclude = "examples"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["examples"]

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["examples/*"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true
exclude = [
    '^examples/',
    '^target/',
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "tarawasm"
version = "0.4.0"
description = "Build WebAssembly components from WIT contracts in multiple languages"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
dependencies = ["click>=8.3.1"]

[project.urls]
Repository = "https://github.com/mandesero/tarawasm"
Issues = "https://github.com/mandesero/tarawasm/issues"

[project.scripts]
tarawasm = "tarawasm.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["tarawasm"]

[tool.hatch.build.targets.sdist]
include = ["/tarawasm", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.black]
line-length = 88
target-version = ["py310"]
force-exclude = "examples"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["examples"]

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["examples/*"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true
exclude = [
    '^examples/',
    '^target/',
]
